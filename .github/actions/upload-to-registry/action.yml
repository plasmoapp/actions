name: 'Upload to Project Registry'
description: 'Push build artifacts to project registry and write a summary of upload links'

inputs:
  registry_url:
    description: 'Registry base API URL (e.g. https://artifacts.example.com/api)'
    required: true
  upload_token:
    description: 'Bearer token for the registry upload endpoint'
    required: true
  files_glob:
    description: 'Files to upload'
    required: false
    default: 'build/libs/*'
  project:
    description: 'Project name in the registry'
    required: false
    default: ${{ github.event.repository.name }}
  branch:
    description: 'Branch name'
    required: false
    default: ${{ github.ref_name }}
  commit:
    description: 'Commit SHA'
    required: false
    default: ${{ github.sha }}
  message:
    description: 'Commit message'
    required: false
    default: ''
  repo_url:
    description: 'Repository URL shown in the registry UI'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}

runs:
  using: composite
  steps:
    - name: Upload to Registry
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry_url }}
        UPLOAD_TOKEN: ${{ inputs.upload_token }}
        PROJECT: ${{ inputs.project }}
        BRANCH: ${{ inputs.branch }}
        COMMIT: ${{ inputs.commit }}
        MESSAGE: ${{ inputs.message }}
        REPO_URL: ${{ inputs.repo_url }}
        FILES_GLOB: ${{ inputs.files_glob }}
      run: |
        if [[ "$BRANCH" =~ ^([0-9]+)/merge$ ]]; then
          BRANCH="pr-${BASH_REMATCH[1]}"
        fi
        short_sha="${COMMIT:0:7}"
        web_url="${REGISTRY_URL%/api}"
        web_url="${web_url%/}"
        project_enc=$(jq -rn --arg s "$PROJECT" '$s|@uri')
        branch_enc=$(jq -rn --arg s "$BRANCH" '$s|@uri')
        commit_link="$web_url/projects/$project_enc/branches/$branch_enc/commits/$COMMIT"
        {
          echo "## Uploaded artifacts"
          echo
          echo "Commit: [\`$short_sha\`]($commit_link)"
          echo
          echo "| File | Link |"
          echo "|------|------|"
        } >> "$GITHUB_STEP_SUMMARY"

        commit_api="$REGISTRY_URL/projects/$project_enc/branches/$branch_enc/commits/$COMMIT"

        # CF doesn't receive response from backend and timeouts with 524,
        # even though file uploads fine and backend returns 201
        # so instead of relying on CF response, we're checking API for an actual file
        verify_uploaded() {
          local want="$1" body url attempt
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 5
            body=$(curl -sS --connect-timeout 15 --max-time 30 "$commit_api" 2>/dev/null) || continue
            url=$(jq -er --arg n "$want" \
              '[.artifacts[]? | select(.filename == $n) | .downloadUrl] | .[0] // empty' \
              <<< "$body" 2>/dev/null) || continue
            [ -n "$url" ] && { printf '%s' "$url"; return 0; }
          done
          return 1
        }

        shopt -s nullglob
        files=($FILES_GLOB)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No files matched glob: $FILES_GLOB"
          exit 1
        fi

        failed=0
        response_body=$(mktemp)
        for file in "${files[@]}"; do
          [ -f "$file" ] || continue
          name=$(basename "$file")
          echo "Uploading $name..."

          http=$(curl -sS -X POST "$REGISTRY_URL/upload" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F "repoUrl=$REPO_URL" \
            -F "project=$PROJECT" \
            -F "branch=$BRANCH" \
            -F "commit=$COMMIT" \
            -F "message=$MESSAGE" \
            -F "file=@$file" \
            --connect-timeout 30 \
            --speed-limit 1024 --speed-time 20 \
            --retry 5 \
            --retry-all-errors \
            --fail-with-body \
            --show-error \
            -o "$response_body" \
            -w '%{http_code}') || http="${http:-000}"

          if [[ "$http" == 2?? ]] && url=$(jq -er '.[0].downloadUrl' < "$response_body" 2>/dev/null); then
            echo "Uploaded $name -> $url"
            echo "| \`$name\` | [download]($url) |" >> "$GITHUB_STEP_SUMMARY"
          elif url=$(verify_uploaded "$name"); then
            echo "Upload got http=$http, but $name is registered for this commit -> $url"
            echo "| \`$name\` | [download]($url) (verified) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed to upload $name (http=$http)"
            head -c 500 "$response_body"; echo
            echo "| \`$name\` | upload failed (http=$http) |" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
        done
        rm -f "$response_body"

        exit $failed
